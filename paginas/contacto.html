<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrontEnd - Contacto</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="shortcut icon" href="../imagenes/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <div class="container">
    <header class="header__container">
      <nav class="navbar">
        <div class="logo">
          <a href="../index.html"
            ><img src="../imagenes/logo.png" alt="Logo"
          /></a>
        </div>
        <ul>
          <li>
            <a href="../index.html"><i class="fa-solid fa-house"></i>Inicio</a>
          </li>
          <li>
            <a href="./productos.html"
              ><i class="fa-solid fa-gift"></i>Productos</a
            >
          </li>
          <li>
            <a href="./contacto.html"
              ><i class="fa-solid fa-envelope"></i>Contacto</a
            >
          </li>
        </ul>
        <div class="github">
          <a
            href="https://github.com/nostyia/TalentoTech-FrontEnd"
            target="_blank"
            ><i class="fa-brands fa-github fa-xl"></i
          ></a>
        </div>
      </nav>
    </header>
    <main class="main">
      <h1>Formulario de contacto</h1>
      <section class="contact"> 
        <form action="https://formspree.io/f/mljdrlgq" method="post">
          <label for="nombre">Nombre</label>
          <input type="name" name="name" placeholder="Juan Perez" />
          <label for="email">Correo Electronico</label>
          <input type="email" name="email" placeholder="juanperez@mail.com" />
          <label for="message">Mensaje</label>
          <textarea name="message" rows="5"></textarea>
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p>Copyright &copy; 2026 - Nostyia</p>
    </footer>
  </div>
  </body>
